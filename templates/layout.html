<!DOCTYPE html>
<html>
<head>
<style>

* {
  box-sizing: border-box;
}

.header {
  height: 10vh;
}

.flex-container {
  display: flex;
  height: 75vh;
  align-items: stretch;
  flex-wrap: nowrap;
  background-color: Gray;
}

.flex-container > div {
  background-color: #f1f1f1;
  width: 100px;
  margin: 5px;
  text-align: center;
}

#contents {
  flex-grow: 1;
  }

#main {
  flex-grow: 4;
  }


</style>
</head>
<body>
<div class="header">
<h1>Flexible Boxes</h1>
</div>
<div class="flex-container">
  <div style="flex-grow: 1">
    <iframe width=100% height=100% src="/"></iframe>
  </div>
  <div style="flex-grow: 4">
    <iframe width=100% height=100% src="/"></iframe>
  </div>
</div>

</body>
</html>
