  <meta charset="utf-8" />
  <title>BSA Calculator Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; color: #222; }
    .row { margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    label { min-width: 140px; }
    input[type="number"] { width: 160px; padding: 6px 8px; }
    .hint { color: #666; font-size: 0.9em; }
    .muted { color: #777; }
    .inline { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <h1>Body Surface Area (BSA)</h1>

  <form id="bsa-form" autocomplete="on" novalidate>
    <div class="row">
      <label for="weight">Weight</label>
      <input id="weight" name="weight" type="number" step="0.1" min="0" placeholder="kg" inputmode="decimal" />
      <span class="hint">kg</span>
    </div>

    <div class="row">
      <label for="height">Height</label>
      <input id="height" name="height" type="number" step="0.1" min="0" placeholder="cm" inputmode="decimal" />
      <span class="hint">cm</span>
    </div>

    <div class="row">
      <label for="bsa">BSA</label>
      <input id="bsa" name="bsa" type="number" step="0.001" min="0" placeholder="m²" inputmode="decimal" />
      <span class="hint">m²</span>
    </div>

    <div class="row">
      <label></label>
      <span class="inline">
        <input type="checkbox" id="autoBsa" checked />
        <label for="autoBsa">Auto-calculate from weight and height</label>
      </span>
    </div>

    <div class="row muted">
      <label></label>
      <span>Formula (Du Bois): BSA = 0.007184 × Height(cm)^0.725 × Weight(kg)^0.425</span>
    </div>
  </form>

  <script>
    (function () {
      const weightEl = document.getElementById('weight');
      const heightEl = document.getElementById('height');
      const bsaEl = document.getElementById('bsa');
      const autoEl = document.getElementById('autoBsa');

      function toNum(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : NaN;
      }

      function calcBSA(heightCm, weightKg) {
        if (!(heightCm > 0) || !(weightKg > 0)) return NaN;
        // Du Bois formula
        const bsa = 0.007184 * Math.pow(heightCm, 0.725) * Math.pow(weightKg, 0.425);
        return bsa;
      }

      function formatBSA(n) {
        if (!Number.isFinite(n)) return '';
        return n.toFixed(3);
      }

      function updateBSAIfAuto() {
        if (!autoEl.checked) return;
        const h = toNum(heightEl.value);
        const w = toNum(weightEl.value);
        const bsa = calcBSA(h, w);
        bsaEl.value = formatBSA(bsa);
      }

      // When user types in weight/height, update BSA if auto mode is on
      weightEl.addEventListener('input', updateBSAIfAuto);
      heightEl.addEventListener('input', updateBSAIfAuto);

      // If user edits BSA manually, turn off auto mode so their custom value stays
      bsaEl.addEventListener('input', function () {
        if (autoEl.checked) {
          autoEl.checked = false;
        }
      });

      // If auto mode is turned back on, immediately recalc and overwrite BSA
      autoEl.addEventListener('change', function () {
        if (autoEl.checked) {
          updateBSAIfAuto();
        }
      });

      // Optional: initialize with sample values
      // weightEl.value = '70';
      // heightEl.value = '170';
      // updateBSAIfAuto();
    })();
  </script>
</body>
</html>
